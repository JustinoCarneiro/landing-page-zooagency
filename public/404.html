<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Página não encontrada | Zoo Agency</title>
	<link rel="icon" type="image/x-icon" href="/favicon.ico">
	<link rel="stylesheet" href="/fonts.css">
	<style>
		:root{--bg:#150602;--orange:#ff6a1a;--orange-soft:#ff8a3d;--text:#efe2d8;--muted:#bda092;}
		*{box-sizing:border-box;margin:0;padding:0;}
		body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;
			background:radial-gradient(ellipse at 50% 20%,#3c1407 0%,var(--bg) 70%);
			color:var(--text);font-family:'Poppins',system-ui,sans-serif;line-height:1.6;}
		main{max-width:30rem;}
		img{width:112px;height:112px;margin:0 auto 20px;display:block;}
		h1{font-family:'Saira Condensed','Arial Narrow',sans-serif;font-size:clamp(3.5rem,14vw,6rem);line-height:1;color:var(--orange);}
		p{color:var(--muted);margin:12px 0 28px;}
		a{display:inline-block;padding:12px 28px;border-radius:999px;background:var(--orange);color:#150602;
			font-weight:600;text-decoration:none;}
		a:hover,a:focus-visible{background:var(--orange-soft);outline:2px solid var(--text);outline-offset:3px;}
	</style>
</head>
<body>
	<main>
		<img src="/imagens/logo.webp" alt="Zoo Agency" width="112" height="112">
		<h1>404</h1>
		<p>Essa página não existe ou foi movida.</p>
		<a href="/">Voltar ao início</a>
	</main>
</body>
</html>
